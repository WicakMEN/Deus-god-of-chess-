<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="divineGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="6"/>

  <!-- Halo Aura / Mind of God -->
  <circle cx="256" cy="180" r="110" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="14 10" opacity="0.6"/>
  <circle cx="256" cy="180" r="85" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>

  <!-- Golden Crown / Knight-King Chess Piece -->
  <g filter="url(#divineGlow)" transform="translate(0, 15)">
    <!-- Crown Base -->
    <path d="M166 360 L346 360 L330 400 L182 400 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="3"/>
    <rect x="156" y="400" width="200" height="24" rx="8" fill="url(#goldGrad)" stroke="#78350f" stroke-width="3"/>

    <!-- King Pedestal & Body -->
    <path d="M190 350 C185 270, 205 240, 220 220 C200 215, 175 225, 160 250 C155 230, 165 200, 185 180 C210 155, 250 145, 275 145 C300 145, 335 155, 345 190 C355 225, 340 270, 322 350 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="4"/>

    <!-- Cross of God / Sovereign Crown -->
    <rect x="246" y="80" width="20" height="60" rx="4" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>
    <rect x="230" y="96" width="52" height="18" rx="4" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>

    <!-- Deus Eye / Core Singularity -->
    <circle cx="256" cy="235" r="16" fill="#09090b" stroke="#fef08a" stroke-width="3"/>
    <circle cx="256" cy="235" r="7" fill="#f59e0b"/>
  </g>
</svg>
